---
name: Release

on:  # yamllint disable rule:truthy
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Integration tests
        run: bazel test //tests:integration_tests
        # Reaches `tflint --init` in the nested Bazel, which is otherwise
        # rate-limited by the GitHub API per runner IP.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # After the suite: bcr_facts resolves only from what it leaves in the
      # repository cache.
      - name: Test extension facts
        run: bazel test //tests:facts_test

  release:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      # The Bazel Central Registry grades archive stability by URL path: only
      # a /releases/download/ asset counts as stable, so the tarball GitHub
      # generates for a tag is not enough. The prefix matches GitHub's own so
      # that source.json's strip_prefix stays valid either way, and
      # .gitattributes decides what the archive omits.
      - name: Build the release archive
        run: |
          tag="${GITHUB_REF_NAME}"
          # HEAD is the tagged commit; naming it avoids depending on the tag
          # ref having been fetched.
          git archive --format=tar --prefix="rules_tf-${tag#v}/" HEAD \
            | gzip > "rules_tf-${tag}.tar.gz"

      - name: Release
        run: >-
          gh release create "$GITHUB_REF_NAME" "rules_tf-${GITHUB_REF_NAME}.tar.gz"
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
