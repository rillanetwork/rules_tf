---
name: actionlint

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/**
  # No branch filter: run on PRs targeting any base branch so stacked PRs
  # (which target an intermediate branch, not main) are also linted.
  pull_request:
    paths:
      - .github/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Lint workflows
        run: bazel test //.github:actionlint --test_output=errors
