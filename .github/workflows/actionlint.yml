---
name: actionlint

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/**
  # No branch filter: run on PRs targeting any base branch so stacked PRs
  # (which target an intermediate branch, not main) are also linted.
  pull_request:
    paths:
      - .github/**

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Lint workflows
        run: bazel test //.github:actionlint --test_output=errors
