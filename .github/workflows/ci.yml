---
name: CI

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
  # No branch filter: run on PRs targeting any base branch so stacked PRs
  # (which target an intermediate branch, not main) are also tested.
  pull_request:

jobs:
  root-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # Root module only: the child modules under tests/ have their own
      # MODULE.bazel, and the integration tests that drive them are tagged
      # manual, so neither is reached from //... . They run in `tests`.
      - name: Test
        run: bazel test //...

  tests:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # Each of these drives a nested Bazel against a child module under
      # tests/. What every suite covers is documented on its target.
      - name: Integration tests
        run: bazel test //tests:integration_tests

      # Separate, and after: every registry host in the bcr_facts mirror is
      # unreachable.invalid, so it resolves only when the packages are already
      # in the repository cache, which the suite above puts there.
      - name: Test extension facts
        run: bazel test //tests:facts_test
