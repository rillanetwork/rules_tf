---
name: CI

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
  # No branch filter: run on PRs targeting any base branch so stacked PRs
  # (which target an intermediate branch, not main) are also tested.
  pull_request:

jobs:
  root-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # //tf/toolchains/git requires a registered git toolchain that the root
      # module does not provide, so //... does not analyze at the root; scope
      # to the packages with tests and buildable tooling instead.
      - name: Test
        run: |
          bazel test //tools/... //tf/rules:providers_lock_test //tf/toolchains:utils_test
          bazel build //tf_apply/... //lint:buildifier.check

  tests:
    strategy:
      matrix:
        bazel-version:
          - 9.x
        runner:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        run: |
          echo "USE_BAZEL_VERSION=${BAZEL_VERSION}" > .bazeliskrc
        env:
          BAZEL_VERSION: ${{matrix.bazel-version}}
        working-directory: tests/bcr

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Test
        run: bazel query "tests(//...)" | xargs -n1 bazel test
        working-directory: tests/bcr

      - name: Test run fmt
        run: bazel query 'kind("tf_format rule", //...)' | xargs -n1 bazel run
        working-directory: tests/bcr

      - name: Test run gendoc
        run: bazel query 'kind("tf_gen_doc rule", //...)' | xargs -n1 bazel run
        working-directory: tests/bcr

      - name: Test run genversions
        run: |
          bazel query 'kind(tf_gen_version, //...)' | xargs bazel build
          bazel cquery 'kind(tf_gen_versions, //...)' --output files | xargs -n1 bash

      - name: Test root module apply rules
        run: |
          bazel run //tf/root-modules/root-mod-a:root-mod-a.init
          bazel run //tf/root-modules/root-mod-a:root-mod-a.plan -- -lock=false
        working-directory: tests/bcr

      - name: Setup mirror_json tests
        run: |
          echo "USE_BAZEL_VERSION=${BAZEL_VERSION}" > .bazeliskrc
        env:
          BAZEL_VERSION: ${{matrix.bazel-version}}
        working-directory: tests/bcr_mirror_json

      - name: Test mirror_json
        run: bazel query "tests(//...)" | xargs -n1 bazel test
        working-directory: tests/bcr_mirror_json

      # Pins its own Bazel via .bazelversion: the facts committed in its
      # MODULE.bazel.lock are only honoured by the release that wrote them.
      - name: Test extension facts
        run: bazel query "tests(//...)" | xargs -n1 bazel test
        working-directory: tests/bcr_facts

      - name: Setup tofu tests
        run: |
          echo "USE_BAZEL_VERSION=${BAZEL_VERSION}" > .bazeliskrc
        env:
          BAZEL_VERSION: ${{matrix.bazel-version}}
        working-directory: tests/bcr_tofu

      - name: Test tofu toolchain
        run: bazel query "tests(//...)" | xargs -n1 bazel test
        working-directory: tests/bcr_tofu

      # Runs `tofu providers lock` for real, harvesting the verified hashes into
      # this workspace's (gitignored) lockfile: coverage that the lock target
      # drives the tofu binary and addresses registry.opentofu.org. The harvest
      # fails if any mirror entry produced no hashes, so exit zero means all of
      # them locked. --check then reads back what was written, which is what
      # catches a fact key or value shape drifting between the two languages.
      #
      # The expunged output base forces the following resolution to be cold, so
      # it goes through the facts in the lockfile rather than a cached extension
      # result -- and, since packages are content-addressed, through the
      # repository cache rather than the registry. What no tofu workspace covers
      # is the facts being the *only* source of verified hashes: this one also
      # sets provider_locks, and bcr_verified covers that path for terraform.
      - name: Test providers lock harvest
        run: |
          bazel run //tf:providers_lock
          bazel run //tf:providers_lock -- --check
          bazel clean --expunge
          bazel query "tests(//...)" | xargs -n1 bazel test
        working-directory: tests/bcr_tofu

      # Verified hashes with no lock file: strict, so the build only passes
      # because the facts committed in its MODULE.bazel.lock cover every entry.
      # --check re-runs `terraform providers lock` and fails if the committed
      # hashes are not the ones it verifies. Pins its own Bazel via
      # .bazelversion, for the same reason the facts workspace does.
      - name: Test verified hashes
        run: |
          bazel query "tests(//...)" | xargs -n1 bazel test
          bazel run //tf:providers_lock -- --check
        working-directory: tests/bcr_verified
