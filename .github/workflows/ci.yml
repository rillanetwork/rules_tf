---
name: CI

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
  # No branch filter: run on PRs targeting any base branch so stacked PRs
  # (which target an intermediate branch, not main) are also tested.
  pull_request:

permissions:
  contents: read

jobs:
  root-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # Root module only: the integration tests are tagged manual and run in
      # the `tests` job.
      - name: Test
        run: bazel test //...

      # `bazel build` only builds the check script; the check runs, and can
      # fail, only under `bazel run`, which needs the workspace directory.
      - name: Lint
        run: bazel run //lint:buildifier.check

  tests:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Integration tests
        run: bazel test //tests:integration_tests
        # Reaches `tflint --init` in the nested Bazel, which is otherwise
        # rate-limited by the GitHub API per runner IP.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # After the suite: bcr_facts resolves only from what it leaves in the
      # repository cache.
      - name: Test extension facts
        run: bazel test //tests:facts_test
