---
name: CI

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
  # No branch filter: run on PRs targeting any base branch so stacked PRs
  # (which target an intermediate branch, not main) are also tested.
  pull_request:

jobs:
  root-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # Root module only: the integration tests are tagged manual and run in
      # the `tests` job.
      - name: Test
        run: bazel test //...

  tests:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Integration tests
        run: bazel test //tests:integration_tests

      # After the suite: bcr_facts resolves only from what it leaves in the
      # repository cache.
      - name: Test extension facts
        run: bazel test //tests:facts_test
