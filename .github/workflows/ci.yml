---
name: CI

on:  # yamllint disable rule:truthy
  push:
    branches:
      - main
  # No branch filter: run on PRs targeting any base branch so stacked PRs
  # (which target an intermediate branch, not main) are also tested.
  pull_request:

jobs:
  root-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # The deleted_packages list in .bazelrc is hand-maintained: a package
      # added under tests/ that is missing from it surfaces only as a
      # toolchain-resolution failure in an unrelated target. Regenerate it and
      # fail if it moved, so the message names the actual problem. Like the
      # Lint step, this needs `bazel run` for the workspace directory.
      - name: Check deleted_packages
        run: |
          bazel run @rules_bazel_integration_test//tools:update_deleted_packages \
            -- --exclude_dir .bazelbsp
          git diff --exit-code .bazelrc

      # Root module only: the integration tests are tagged manual and run in
      # the `tests` job.
      - name: Test
        run: bazel test //...

      # `bazel build` only builds the check script; the check runs, and can
      # fail, only under `bazel run`, which needs the workspace directory.
      - name: Lint
        run: bazel run //lint:buildifier.check

  tests:
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.runner }}

    # tflint --init resolves every ruleset through the GitHub releases API,
    # which allows 60 requests an hour unauthenticated - a quota shared with
    # every other job leaving the runner's egress address, so it 403s
    # unpredictably. A token raises it to 5000. .bazelrc forwards the variable
    # into the test action, whose environment is otherwise scrubbed.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Integration tests
        run: bazel test //tests:integration_tests

      # After the suite: bcr_facts resolves only from what it leaves in the
      # repository cache.
      - name: Test extension facts
        run: bazel test //tests:facts_test
